# This template is a standalone project, not a member of the IronRoot
# workspace. The empty table makes it its own workspace root so `cargo build`
# works from this directory instead of failing on the repository root manifest.
[workspace]

[package]
name = "ironroot-web-app"
version = "0.1.0"
edition = "2024"
description = "IronRoot web application template"

