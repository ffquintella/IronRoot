[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/macros",
    "crates/web",
    "crates/cli",
    "crates/gui",
    "crates/log",
    "crates/dal",
    "crates/dal-hiqlite",
    "crates/auth",
    "crates/new",
    "mcp/servers/example_server",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ffquintella/IronRoot"
authors = ["IronRoot Contributors"]

[workspace.dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
