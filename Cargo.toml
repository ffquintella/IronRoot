[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/macros",
    "crates/web",
    "crates/cli",
    "crates/gui",
    "crates/log",
    "crates/dal",
    "crates/auth",
    "crates/new",
    "mcp/servers/example_server",
]
# `ironroot-dal-hiqlite` lives in this repo but is intentionally NOT a
# workspace member because it links `libsqlite3-sys` via hiqlite/rusqlite,
# which conflicts with the `sqlite` feature on `ironroot-dal` (sqlx-sqlite).
# It builds as a standalone crate from `crates/dal-hiqlite/` — see its README.
exclude = ["crates/dal-hiqlite"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ffquintella/IronRoot"
authors = ["IronRoot Contributors"]

[workspace.dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
