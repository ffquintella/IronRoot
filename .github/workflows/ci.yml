name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. A job that needs more asks for it explicitly.
permissions:
  contents: read

# A force-push to a PR branch supersedes the previous run; keep the newest only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to a full commit SHA, not a tag. A tag is
# mutable: whoever controls the action repository can repoint `v2` at new code
# and it runs here with our token. The trailing comment records the human-
# readable version the SHA corresponds to; .github/dependabot.yml keeps both
# in sync.
#
# Matrix values reach `run:` through `env:` rather than direct `${{ }}`
# interpolation. These particular values are static and workspace-defined, so
# nothing untrusted flows in today — but the habit is what stops the day someone
# adds a matrix entry derived from a branch name or an event payload.
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt
            cmd: cargo fmt --all -- --check
            components: rustfmt
          - name: clippy
            cmd: cargo clippy --workspace --all-targets -- -D warnings
            components: clippy
          - name: test
            cmd: cargo test --workspace
            components: ""
          - name: docs
            cmd: cargo doc --workspace --no-deps
            components: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          # Do not leave the job token in .git/config, where any later step —
          # or anything that archives the workspace — can read it back out.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master@2026-01
        with:
          toolchain: stable
          components: ${{ matrix.components }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.3
      - env:
          CMD: ${{ matrix.cmd }}
        run: $CMD

  # The DAL's feature flags select mutually independent backends; a plain
  # `--workspace` build only ever exercises the default set.
  features:
    name: feature matrix (ironroot-dal)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features --features sqlite"
          - "--no-default-features --features mysql"
          - "--no-default-features --features postgres"
          - "--all-features"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master@2026-01
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.3
      - env:
          FEATURES: ${{ matrix.features }}
        run: cargo check -p ironroot-dal $FEATURES

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master@2026-01
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.3
      - run: cargo check --workspace --all-targets
