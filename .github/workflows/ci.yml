name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt
            cmd: cargo fmt --all -- --check
            components: rustfmt
          - name: clippy
            cmd: cargo clippy --workspace --all-targets -- -D warnings
            components: clippy
          - name: test
            cmd: cargo test --workspace
            components: ""
          - name: docs
            cmd: cargo doc --workspace --no-deps
            components: ""
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.components }}
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.cmd }}

  # The DAL's feature flags select mutually independent backends; a plain
  # `--workspace` build only ever exercises the default set.
  features:
    name: feature matrix (ironroot-dal)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features --features sqlite"
          - "--no-default-features --features mysql"
          - "--no-default-features --features postgres"
          - "--all-features"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ironroot-dal ${{ matrix.features }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
