[package]
name = "ironroot-dal-hiqlite"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Hiqlite (Raft-backed embedded SQLite) integration for ironroot-dal"

# `ironroot-dal-hiqlite` is a first-class workspace member. The previous
# `links = "sqlite3"` conflict was resolved by switching `ironroot-dal`'s
# SQLite backend from `sqlx-sqlite` to `rusqlite` — the same crate hiqlite
# uses — so only one `libsqlite3-sys` enters the dep graph.
#
# This crate still does not depend on `ironroot-dal`: callers that only
# want hiqlite can avoid the sqlx (MySQL/Postgres) transitive deps. The
# small `DalError` / `ExecResult` shapes are duplicated, intentionally.

[dependencies]
hiqlite = { version = "0.14", default-features = false, features = ["sqlite"] }
thiserror = "2"
tracing = "0.1"
