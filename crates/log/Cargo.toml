[package]
name = "ironroot-log"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Default logging facade for IronRoot — file rotation (10MB) and optional syslog export"

[features]
default = []
# Enable syslog export via the `LogConfig::with_syslog` builder.
syslog = ["dep:syslog"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
file-rotate = "0.8"
thiserror = "2"
syslog = { version = "7", optional = true }

[dev-dependencies]
tempfile = "3"
