[package]
name = "ironroot-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Default logging facade for IronRoot — file rotation (10MB) and optional syslog export"

[features]
default = []
# Enable syslog export via the `LogConfig::with_syslog` builder.
syslog = ["dep:syslog"]

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
file-rotate = "0.8"
thiserror.workspace = true
syslog = { version = "7", optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
