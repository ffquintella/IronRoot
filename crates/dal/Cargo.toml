[package]
name = "ironroot-dal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Data Access Layer for IronRoot — routes between SQLite and MySQL backends"

[features]
default = ["sqlite", "mysql"]
# SQLite via rusqlite — shares `libsqlite3-sys` with `ironroot-dal-hiqlite`
# (which is also rusqlite-based), so both can coexist in one workspace.
sqlite = ["dep:rusqlite", "dep:tokio"]
mysql = ["dep:sqlx-mysql"]
postgres = ["dep:sqlx-postgres"]

[dependencies]
# Depend on individual sqlx subcrates rather than the umbrella `sqlx` crate.
# The umbrella crate declares `sqlx-sqlite` as an optional dependency, and
# Cargo's resolver still picks a version for it (along with its conflicting
# `libsqlite3-sys` requirement) — which collides with the `libsqlite3-sys`
# pulled by `hiqlite`/`rusqlite` in this workspace.
sqlx-core = { version = "0.7.4", default-features = false, features = ["_rt-tokio", "_tls-rustls"] }
sqlx-mysql = { version = "0.7.4", default-features = false, optional = true }
sqlx-postgres = { version = "0.7.4", default-features = false, optional = true }
rusqlite = { version = "0.39", default-features = false, features = ["bundled"], optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
