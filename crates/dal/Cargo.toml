[package]
name = "ironroot-dal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Data Access Layer for IronRoot — routes between SQLite and MySQL backends"

[features]
default = ["sqlite", "mysql"]
# SQLite via rusqlite — shares `libsqlite3-sys` with `ironroot-dal-hiqlite`
# (which is also rusqlite-based), so both can coexist in one workspace.
sqlite = ["dep:rusqlite", "dep:tokio", "dep:deadpool"]
mysql = ["dep:sqlx-mysql"]
postgres = ["dep:sqlx-postgres"]

[dependencies]
# Depend on individual sqlx subcrates rather than the umbrella `sqlx` crate.
# The umbrella crate declares `sqlx-sqlite` as an optional dependency, and
# Cargo's resolver still picks a version for it (along with its conflicting
# `libsqlite3-sys` requirement) — which collides with the `libsqlite3-sys`
# pulled by `hiqlite`/`rusqlite` in this workspace.
# sqlx 0.9 split the old `_tls-rustls` feature into provider-specific variants;
# `_tls-rustls-ring-webpki` (ring backend + bundled webpki roots) is the direct
# equivalent of what `_tls-rustls` selected under 0.7.
sqlx-core = { version = "0.9", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki"] }
sqlx-mysql = { version = "0.9", default-features = false, optional = true }
sqlx-postgres = { version = "0.9", default-features = false, optional = true }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"], optional = true }
# Generic deadpool rather than `deadpool-sqlite`: that crate pins rusqlite
# ^0.38, and rusqlite carries `links = "sqlite3"`, so pulling it in would force
# a rusqlite downgrade that hiqlite 0.14 (which needs ^0.40) forbids. deadpool
# itself is already in the tree via hiqlite, so the manager below costs nothing
# extra.
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"], optional = true }
tokio = { workspace = true, features = ["rt", "sync"], optional = true }
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true

[lints]
workspace = true
